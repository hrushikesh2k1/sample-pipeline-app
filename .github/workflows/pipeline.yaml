name: Unoptimized AI-SRE Test Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Anti-pattern: No caching enabled here!
          
      - name: Install Dependencies
        run: |
          pip install flake8 pytest
          # Simulating a heavy install time
          sleep 15
          
      - name: Run Linter
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  test:
    needs: lint # Anti-pattern: Unnecessary sequential dependency!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Re-Install Dependencies (Wasteful)
        run: |
          pip install flake8 pytest
          sleep 15
          
      - name: Run Tests
        run: |
          # A simple test command that will pass
          echo "Running tests..."
          pytest --version

  build:
    needs: test # Anti-pattern: Unnecessary sequential dependency!
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Re-Install Dependencies Again (Wasteful)
        run: |
          pip install flake8 pytest
          sleep 15
          
      - name: Build Artifacts
        run: |
          echo "Building fake artifacts..."
          mkdir -p dist
          echo "build success" > dist/build.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Useless Install
        run: |
          pip install flake8 pytest
          sleep 15
          
      - name: Deploy
        run: |
          echo "Deploying to production..."
