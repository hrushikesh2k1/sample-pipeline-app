name: sample-pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sample-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ~/.cache/pip
  VENV_DIR: ./.venv # Define virtual environment directory

jobs:
  setup-environment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Create and install dependencies into virtual environment
        run: |
          python -m venv ${{ env.VENV_DIR }}
          source ${{ env.VENV_DIR }}/bin/activate
          pip install -r requirements.txt
          pip install pytest-cov # Added pytest-cov as it's used in unit-tests

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: ${{ env.VENV_DIR }}
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-

  quality-gate:
    runs-on: ubuntu-latest
    needs: setup-environment
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore virtual environment cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VENV_DIR }}
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Activate virtual environment
        run: source ${{ env.VENV_DIR }}/bin/activate

      - name: Validate Python sources
        run: python -m compileall .

  unit-tests:
    runs-on: ubuntu-latest
    needs: setup-environment # Runs in parallel with quality-gate and regression-baseline
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore virtual environment cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VENV_DIR }}
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Activate virtual environment
        run: source ${{ env.VENV_DIR }}/bin/activate

      - name: Run unit tests
        run: |
          source .venv/bin/activate
          pytest tests/ --cov=my_app

      - name: Upload unit test report
        if: always() # Ensure artifact is uploaded even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: artifacts/unit-test-results.xml

  regression-baseline:
    runs-on: ubuntu-latest
    needs: setup-environment # Runs in parallel with quality-gate and unit-tests
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore virtual environment cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VENV_DIR }}
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Activate virtual environment
        run: source ${{ env.VENV_DIR }}/bin/activate

      - name: Run regression snapshot check
        run: python scripts/check_regression.py --baseline baseline/expected_snapshot.json --report artifacts/regression-report.json

      - name: Upload regression report
        if: always() # Ensure artifact is uploaded even if check fails
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: artifacts/regression-report.json

  package-artifact:
    runs-on: ubuntu-latest
    needs: [quality-gate, unit-tests, regression-baseline] # Depends on all parallel test jobs
    steps:
      - name: Checkout source # Need source code for packaging, but not the full environment
        uses: actions/checkout@v4

      - name: Assemble release bundle
        run: |
          mkdir -p package/baseline
          mkdir -p dist
          cp app.py package/
          cp baseline/expected_snapshot.json package/baseline/
          cp README.md package/
          tar -czf dist/sample-pipeline-app.tar.gz -C package .

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/sample-pipeline-app.tar.gz

  release-readiness:
    runs-on: ubuntu-latest
    needs: package-artifact
    steps:
      - name: Create workflow summary
        run: |
          {
            echo "## Release readiness"
            echo ""
            echo "- Quality gate: passed"
            echo "- Unit tests: passed"
            echo "- Regression baseline: matched approved output"
            echo "- Packaging: release bundle generated"
          } >> "$GITHUB_STEP_SUMMARY"
